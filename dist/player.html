<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeTube Player</title>
    <link rel="stylesheet" href="lib/plyr.css" />
    <style>
        body {
            margin: 0;
            background: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            max-width: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plyr {
            width: 100%;
            height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="error-message" style="display: none; color: white; text-align: center; font-family: sans-serif;">
            <h2 style="margin-bottom: 10px;">Video Not Found (404)</h2>
            <p>The file may have been deleted or moved on the server.</p>
        </div>
        <video id="player" playsinline controls>
            <source src="" type="video/mp4" />
        </video>
    </div>
    <script src="lib/plyr.js"></script>
    <script src="player.js"></script>
</body>

</html>
