<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeTube Downloader Settings</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            border-bottom: 1px solid var(--input-bg);
            padding-bottom: 16px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--input-bg);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .status {
            margin-left: 16px;
            color: var(--text-muted);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <h1>Settings</h1>
    <div class="form-group">
        <label for="metube-url">MeTube Instance URL</label>
        <input type="text" id="metube-url" placeholder="http://localhost:8081">
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 8px;">
            Enter the full URL to your MeTube instance (e.g., http://192.168.1.10:8081).
        </p>
    </div>
    <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" id="enable-notifications" style="width: auto; margin: 0;">
        <label for="enable-notifications" style="margin: 0; cursor: pointer;">Enable Download Notifications</label>
    </div>
    <button id="save-btn">Save Settings</button>
    <span id="status" class="status">Saved!</span>

    <script src="options.js"></script>
</body>

</html>
